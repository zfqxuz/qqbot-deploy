# 开发者模式（可选）：源码**可写**挂载 + docker 控制权。
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   （install.sh --dev 会自动带上；普通用户不需要这个文件）
#
# 它只做两件事，别的都不碰：
#   1) 源码仓库按原路径挂进来，**可写** —— 容器里能直接改代码、git 提交、构建镜像
#   2) /var/run/docker.sock 挂进来 —— 容器里 docker ps/logs/build 可用
#      （进 docker 组这件事由主文件的 group_add + .env 的 QQ_DOCKER_GID 负责，
#        这里不能重复定义，否则 compose 合并后 group_add 出现重复项直接报错）
#
# [round5 定调] gh 凭据、git 身份、DSH 工作区属于「系统配置」，一律在控制台（/system）里配，
# 由容器启动时渲染成 ~/.config/gh/hosts.yml 与 ~/.gitconfig，**不再靠这里挂宿主凭据**。
# 这样"配置归用户、镜像只换代码"在开发机上同样成立。
#
# 注意：挂 docker.sock ≈ 给这个容器宿主机 root 级别能力。只在你自己信任的机器上开。
services:
  harness:
    volumes:
      - ${QQ_REPOS_ROOT:-${HOME}/dev}:${QQ_REPOS_ROOT:-${HOME}/dev}
      - ${QQ_SSH_DIR:-${HOME}/.ssh}:${QQ_SSH_DIR:-${HOME}/.ssh}:ro
      - /var/run/docker.sock:/var/run/docker.sock
