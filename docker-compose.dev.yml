# 开发者模式（可选）：把源码/凭据/客户端按原路径挂进容器
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   （install.sh 加环境变量 QQ_DEV_MOUNT=1 也会自动带上）
#
# 挂了什么、代价是什么：
#   QQ_REPOS_ROOT      源码仓库只读挂载 → 改完源码重启容器即生效
#   ~/.config/gh       GitHub 登录凭据（可写：容器里也能 gh auth login）→ 容器里能 gh repo/pr/run
#   ~/.ssh             ssh 私钥（只读）→ 容器里能 git push over ssh
#   ~/.gitconfig       git 身份/别名（只读）
#   /var/run/docker.sock  docker 控制权 → 容器里能 docker ps/logs/build
#
# 代价说清楚：挂了 docker.sock ≈ 给了这个容器宿主机 root 级别的能力；gh/ssh 凭据也会对
# 容器内所有进程（包括模型驱动的工具调用）可见。只在你自己信任的机器上开。
services:
  harness:
    environment:
      GH_CONFIG_DIR: ${QQ_GH_CONFIG_DIR:-${HOME}/.config/gh}
      GIT_CONFIG_GLOBAL: ${QQ_GIT_CONFIG:-${HOME}/.gitconfig}
    volumes:
      - ${QQ_REPOS_ROOT:-${HOME}/dev}:${QQ_REPOS_ROOT:-${HOME}/dev}:ro
      - ${QQ_GH_CONFIG_DIR:-${HOME}/.config/gh}:${QQ_GH_CONFIG_DIR:-${HOME}/.config/gh}
      - ${QQ_SSH_DIR:-${HOME}/.ssh}:${QQ_SSH_DIR:-${HOME}/.ssh}:ro
      - ${QQ_GIT_CONFIG:-${HOME}/.gitconfig}:${QQ_GIT_CONFIG:-${HOME}/.gitconfig}:ro
      - /var/run/docker.sock:/var/run/docker.sock
