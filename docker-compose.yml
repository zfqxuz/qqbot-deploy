# QQ 机器人整套栈（[阶段 2] 2026-10-12）
#
# 设计取舍（和现状保持行为一致，先不改造架构）：
#   - napcat 与 harness 都用 host 网络：NapCat 要反连 ws://127.0.0.1:6700，
#     而且 QQ 协议端有自己的端口需求，host 网络最省事、和现在完全一致；
#   - console 独立容器、独立进程：DSH 挂了它照样能用（用户明确要求解耦）；
#   - harness 的代理由 entrypoint 守卫决定：探活可用就带代理启动、不可用就直连，
#     运行期翻转则退出让 compose 重启后重新决策。
#
# 路径策略（重要）：本文件**不含任何宿主绝对路径**，全部来自 .env：
#   QQ_DATA_ROOT  桥接数据/日志/状态/配置（容器内固定挂到 /data/qqbot）
#   QQ_DSH_HOME   DSH home（profile、插件、会话、凭据；容器内挂到 /data/dsh）
#   QQ_NAPCAT_*   QQ 登录态、NapCat 配置、二维码缓存
#   QQ_REPOS_ROOT 三个仓库共同的父目录（构建上下文；开发期热更也用它）
# 首次部署跑 ./install.sh，它会按当前用户 HOME 生成这些值并建目录。
name: qqbot

services:
  napcat:
    image: ${NAPCAT_IMAGE:-docker.m.daocloud.io/mlikiowa/napcat-docker:latest}
    container_name: napcat
    network_mode: host
    restart: unless-stopped
    environment:
      ACCOUNT: ${QQ_ACCOUNT:?必须在 .env 里设置 QQ_ACCOUNT（登录用的 QQ 号）}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${QQ_NAPCAT_DATA:?请在 .env 设置 QQ_NAPCAT_DATA}:/app/.config/QQ
      - ${QQ_NAPCAT_CONFIG:?请在 .env 设置 QQ_NAPCAT_CONFIG}:/app/napcat/config
      - ${QQ_NAPCAT_CACHE:?请在 .env 设置 QQ_NAPCAT_CACHE}:/app/napcat/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6099/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  harness:
    # 镜像从哪来：本地 ./build.sh 构建（默认 qqbot-harness:<tag>）或 .env 指向的仓库
    # 默认用预构建镜像（公开可拉）；想用本地构建的镜像就在 .env 里设 QQ_HARNESS_IMAGE=qqbot-harness:<tag>
    image: ${QQ_HARNESS_IMAGE:-crpi-nqwu6u57qjindq7p.cn-hangzhou.personal.cr.aliyuncs.com/zfqxuz/qqbot-harness:${QQ_TAG:-v0.7.0}}
    container_name: qqbot-harness
    working_dir: ${QQ_WORKSPACE:?}          # 新会话落在这个工作区里（不设就落到 /data/qqbot）
    # 以宿主用户身份跑：数据卷里的文件属主与宿主一致，用户不用 sudo 就能改自己的配置
    user: "${QQ_UID:-1000}:${QQ_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    depends_on:
      - napcat
    # dsh.env 用来喂宿主级环境变量（代理、看门狗参数等）；文件不存在也能起（required: false）
    env_file:
      - path: ${QQ_ENV_FILE:-./dsh.env}
        required: false
    environment:
      QQ_DATA_ROOT: /data/qqbot
      DSH_HOME: /data/dsh
      HOME: /data/qqbot          # 家目录也放在数据卷里：npm/git 配置随数据一起带走
      QQ_REPOS: /opt/repos
      DSH_PORT: ${QQ_DSH_PORT:-3081}
      QQ_WORKSPACE: ${QQ_WORKSPACE:?请在 .env 设置 QQ_WORKSPACE（工作区目录，首启为空）}
      QQ_ACCOUNT: ${QQ_ACCOUNT:-}
      QQ_VERSION: ${QQ_TAG:-v1}
      UPSTREAM_PROXY: ${UPSTREAM_PROXY:-}
      PROXY_PROBE_URL: ${PROXY_PROBE_URL:-https://api.deepseek.com}
      PROBE_TIMEOUT: ${PROBE_TIMEOUT:-4}
      NO_PROXY: 127.0.0.1,localhost,::1
    volumes:
      - ${QQ_DATA_ROOT:?请在 .env 设置 QQ_DATA_ROOT}:/data/qqbot
      - ${QQ_DSH_HOME:?请在 .env 设置 QQ_DSH_HOME}:/data/dsh
      - ${QQ_WORKSPACE:?}:${QQ_WORKSPACE:?}   # 工作区：按原路径挂进去；首启为空，重建容器不动它

  console:
    image: ${QQ_CONSOLE_IMAGE:-crpi-nqwu6u57qjindq7p.cn-hangzhou.personal.cr.aliyuncs.com/zfqxuz/qqbot-console:${QQ_TAG:-v0.7.0}}
    container_name: qqbot-console
    user: "${QQ_UID:-1000}:${QQ_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    # 故意不 depends_on harness：DSH 起不来时控制台也要能用
    environment:
      QQ_DATA_ROOT: /data/qqbot
      DSH_HOME: /data/dsh
      HOME: /tmp                   # 控制台不需要家目录，给个可写目录
      QQ_CONSOLE_PORT: ${QQ_CONSOLE_PORT:-8798}
      QQ_DSH_ENV: ${QQ_ENV_FILE:-./dsh.env}
      QQ_NAPCAT_CONFIG_DIR: /data/qqbot/napcat-config
      QQ_DSH_PORT: ${QQ_DSH_PORT:-3081}          # 控制台探活用
      QQ_VERSION: ${QQ_TAG:-v1}
    volumes:
      - ${QQ_DATA_ROOT:?请在 .env 设置 QQ_DATA_ROOT}:/data/qqbot
      - ${QQ_DSH_HOME:?请在 .env 设置 QQ_DSH_HOME}:/data/dsh
      - /var/run/docker.sock:/var/run/docker.sock:ro   # 只为显示容器状态；没有也能跑
