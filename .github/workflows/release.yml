# ============================================================
#  构建"发布版安装器"：.deb / .rpm / Windows .exe / macOS .pkg
#
#  触发：推 v* tag（例：git tag v0.7.3 && git push --tags），或在 Actions 页手动 Run 并填版本号。
#  产物挂到本仓库的 Release 上，用户即可下载：
#    qqbot-deploy_<版本>_all.deb      Debian/Ubuntu：dpkg -i，然后 qqbot-install
#    qqbot-deploy-<版本>-1.*.noarch.rpm  Fedora/RHEL：rpm -i，然后 qqbot-install
#    qqbot-deploy-<版本>-setup.exe    Windows：双击安装 → 开始菜单"安装 QQ 机器人"
#    qqbot-deploy-<版本>.pkg          macOS：installer -pkg … ，然后 qqbot-install
#
#  这些安装包只放文件、不起服务、不碰数据（包管理器只负责放文件，安装由用户显式发起）。
#  未做代码签名 → Windows SmartScreen / macOS Gatekeeper 会提示，文档里已写明绕法。
# ============================================================
name: build-installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（默认取 tag；手动跑时填，例如 0.7.3）'
        required: false
        default: ''

permissions:
  contents: write

env:
  # tag 形如 v0.7.3；手动触发时用输入的版本号
  RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 所有 shell 脚本语法检查
        run: |
          set -e
          n=0
          while IFS= read -r -d '' f; do bash -n "$f"; n=$((n+1)); done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          echo "bash -n 通过：$n 个脚本"
      - name: PowerShell / Inno 脚本必须带 UTF-8 BOM
        run: |
          set -e
          bad=0
          while IFS= read -r -d '' f; do
            if ! head -c 3 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^efbbbf$'; then
              echo "::error file=$f::缺 UTF-8 BOM —— Windows PowerShell 5.1 会按 ANSI 读，中文变乱码并让脚本解析失败（2026-10-12 用户实测踩到）"
              bad=1
            fi
          done < <(find . \( -name '*.ps1' -o -name '*.iss' \) -not -path './.git/*' -print0)
          [ "$bad" = 0 ] && echo "BOM 检查通过"
      - name: Inno 快捷方式名里不许有 Windows 非法字符
        run: |
          set -e
          bad=0
          # 名字部分（{group}\ 之后）不允许 / \ : * ? " < > | —— 带 "/" 会被 Windows 当子目录，
          # 安装时直接失败：IPersistFile::Save failed; code 0x80070003（2026-10-12 实测踩到）
          while IFS= read -r line; do
            name=$(printf '%s' "$line" | grep -oE 'Name: "\{group\}\\[^"]*"' | sed 's/^Name: "{group}\\//; s/"$//')
            [ -n "$name" ] || continue
            case "$name" in
              */*|*\\*|*:*|*\**|*\?*|*\"*|*\<*|*\>*|*\|*)
                echo "::error::快捷方式名含 Windows 非法字符：$name"; bad=1 ;;
            esac
          done < packaging/windows/qqbot.iss
          [ "$bad" = 0 ] && echo "快捷方式名检查通过"
      - name: 所有 mjs 脚本语法检查
        run: |
          set -e
          for f in $(find . -name '*.mjs' -not -path './.git/*'); do node --check "$f"; echo "node --check 通过：$f"; done

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 rpmbuild（打 .rpm 用）
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: 打 .deb
        run: bash packaging/linux/build-deb.sh "${RAW_VERSION#v}" dist
      - name: 打 .rpm
        run: bash packaging/linux/build-rpm.sh "${RAW_VERSION#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 组装 payload（白名单，绝不带 .env / 备份 / 构建产物）
        shell: pwsh
        run: |
          $dst = 'packaging\windows\payload'
          New-Item -ItemType Directory -Force $dst | Out-Null
          $items = @('install.sh','install.cmd','install.command','update.sh','uninstall.sh',
                     'backup.sh','restore.sh','README.md','HOST-INSTALL.md','UPDATE-UNINSTALL.md',
                     'docker-compose.yml','docker-compose.desktop.yml','docker-compose.dev.yml',
                     'dsh-web-run.mjs','install-wizard.html','install-wizard.py','host','.env.example')
          foreach ($i in $items) { if (Test-Path $i) { Copy-Item -Recurse -Force $i $dst } }
          Get-ChildItem $dst | Select-Object Name | Format-Table
      - name: 用 Windows PowerShell 5.1 解析所有 .ps1（复现用户实际的解码方式）
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::PowerShell 5.1 解析失败"
              $errs | ForEach-Object { Write-Host ("  行{0} 列{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
              $bad = 1
            } else { Write-Host "parse OK (PS 5.1): $($_.Name)" }
          }
          if ($bad -ne 0) { exit 1 }
      - name: 装 Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: 编译安装器
        shell: pwsh
        run: |
          $ver = $env:RAW_VERSION.TrimStart('v')
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          & $iscc "packaging\windows\qqbot.iss" "/DAppVersion=$ver"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "packaging\windows\Output\*.exe" dist -Force
          Get-ChildItem dist | Format-Table Name, Length
      - name: 冒烟测试：静默装一遍再卸掉（抓"只有安装时才暴露"的错）
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'qqbot-smoke'
          Write-Host "安装到 $dir"
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir")
          Write-Host "安装器退出码：$($p.ExitCode)"
          foreach ($f in @('host\install-host.ps1','host\uninstall-host.ps1','update.sh','UPDATE-UNINSTALL.md')) {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Host "::error::安装后缺少 $f"; exit 1 }
            Write-Host "在：$f"
          }
          # 开始菜单快捷方式（这一步以前炸过：名字里带 "/" → 0x80070003）
          $lnk = Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs') -Recurse -Filter '*.lnk' -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*重新安装*' }
          if (-not $lnk) { Write-Host '::error::没找到开始菜单快捷方式（快捷方式创建失败过）'; exit 1 }
          Write-Host "快捷方式：$($lnk.FullName)"
          $un = Join-Path $dir 'unins000.exe'
          if (Test-Path $un) { Start-Process -Wait -FilePath $un -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') }
          Write-Host '冒烟测试通过'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打 .pkg
        run: bash packaging/macos/build-pkg.sh "${RAW_VERSION#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg
          if-no-files-found: error

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            安装包（只放文件，不起服务、不碰数据；装完自己跑安装命令）：

            - **Debian/Ubuntu**：`sudo dpkg -i qqbot-deploy_*_all.deb` → `qqbot-install`
            - **Fedora/RHEL**：`sudo rpm -i qqbot-deploy-*.rpm` → `qqbot-install`
            - **Windows**：双击 `qqbot-deploy-*-setup.exe` → 开始菜单「安装 QQ 机器人（不用 Docker）」
            - **macOS**：`sudo installer -pkg qqbot-deploy-*.pkg -target /` → `qqbot-install`

            更新 / 卸载：`qqbot-update` / `qqbot-uninstall`（默认保留数据）。
            完整说明见包内 `UPDATE-UNINSTALL.md`；也可以直接用一行安装：
            `curl -fsSL https://raw.githubusercontent.com/zfqxuz/qqbot-deploy/main/host/get-qqbot.sh | bash -s -- --qq <机器人QQ号>`

            注意：安装包**未做代码签名** —— Windows 会提示"未知发布者"（更多信息 → 仍要运行），
            macOS 首次打开需右键打开或 `xattr -d com.apple.quarantine`。
